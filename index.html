<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untuk Yazida</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(circle at 50% 30%,#3a2740,#16111c 70%);color:#f3e9f0;font-family:Georgia,'Times New Roman',serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;transition:opacity .8s ease,visibility .8s}
.hidden{opacity:0;visibility:hidden;pointer-events:none}

/* Envelope */
.env{position:relative;width:min(300px,80vw);height:200px;margin-bottom:40px;animation:float 3s ease-in-out infinite}
.env.open{animation:none}
@keyframes float{50%{transform:translateY(-10px)}}
.env .back{position:absolute;inset:0;background:#c98fa8;border-radius:6px}
.env .paper{position:absolute;left:8%;right:8%;top:8%;height:80%;background:#fff8f2;border-radius:4px;display:flex;align-items:center;justify-content:center;text-align:center;color:#6b3a52;font-size:1.05rem;font-style:italic;padding:10px;transition:transform .9s ease .6s,z-index 0s .6s;z-index:1}
.env.open .paper{transform:translateY(-95px);z-index:3}
.env .front{position:absolute;inset:0;z-index:2;background:linear-gradient(135deg,#e0a9c0 50%,transparent 50%) left/51% 100% no-repeat,linear-gradient(225deg,#d79ab3 50%,transparent 50%) right/51% 100% no-repeat;border-radius:6px}
.env .bottom{position:absolute;left:0;right:0;bottom:0;height:60%;z-index:2;background:#d38fac;clip-path:polygon(0 100%,50% 25%,100% 100%);border-radius:0 0 6px 6px;opacity:.0}
.env .flap{position:absolute;left:0;right:0;top:0;height:55%;background:#b97593;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s ease;z-index:4}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.heart{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:5;font-size:1.4rem;transition:opacity .3s}
.env.open .heart{opacity:0}

button{font-family:inherit;font-size:1rem;color:#fff;background:#b9628a;border:none;padding:12px 34px;border-radius:30px;cursor:pointer;transition:transform .2s,background .2s;letter-spacing:.5px}
button:hover{background:#cf72a0;transform:translateY(-2px)}
.fade-text{animation:in 1s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Pages */
.page{max-width:560px;text-align:center}
.page p{font-size:clamp(1.05rem,3.6vw,1.3rem);line-height:1.85;margin-bottom:36px}
.page.active p{animation:in 1s ease both}
.dots{position:absolute;bottom:26px;display:flex;gap:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:#ffffff30;transition:background .4s}
.dots i.on{background:#e0a9c0}
.nav{display:flex;gap:12px;justify-content:center}
button.ghost{background:transparent;border:1px solid #b9628a;color:#e0a9c0}
button.ghost:hover{background:#b9628a33}
.pg{overflow-y:auto}
.pg .page{margin:auto}
</style>
</head>
<body>

<!-- Intro: surat -->
<div id="intro" class="screen">
  <div class="env" id="env">
    <div class="back"></div>
    <div class="paper">Dear Yazida piw piw 🤍</div>
    <div class="front"></div>
    <div class="flap"></div>
    <div class="heart">💌</div>
  </div>
  <button id="openBtn">Buka</button>
</div>

<!-- Pages -->
<div id="pages"></div>
<div class="dots hidden" id="dots"></div>

<script>
const texts=[
"Aku minta maaf ya, buat beberapa bulan terakhir ini. Kalau selama ini aku annoying atau bikin km nggak nyaman.",
"Setelah aku nanya dan sedikit ngelihat dari sudut pandang kamu, aku mau jujur soal yang sebenarnya aku rasain. Bukan buat nyalahin siapa-siapa, cuma biar km tahu aja.",
"Aku udah nggak sanggup nahan cemburu. Sejak awal kamu dan dia mulai pdkt, dari situ aku udah ngerasa nggak enak. Tapi yaaa mau gimana lagi, aku nggak bisa maksa.",
"Mungkin ini karma karena dulu aku kurang menghargai kamu atau apapun itu. Buat nahan semuanya, pelampiasanku cuma rokok, dan akhir-akhir ini makin nggak terkontrol, Overthinking berhari-hari dan susah tidur.",
"Aku nggak mungkin ngelarang kalian dekat, itu egois banget, apalagi sekarang kita nggak punya status. Jadi satu-satunya pilihan yang masuk akal buatku adalah menghilang dulu, supaya aku bisa belajar nerima ini wkwkwk, soalnya jealous-nya udah engga tertolong, padahal kita cuma mantan.",
"Soal kejadian kemarin, aku minta maaf. Bukan maaf buat kejadiannya, tapi maaf karena udah bikin kamu merasa bersalah. Itu bukan salahmu, dan aku nggak mau kamu mikul itu.",
"Aku kemarin tanya soal kamu masih punya perasaan dan aku dianggap apa and i see you consider me a brother, yet you have feelings [for me] thanks but i see you as a girl.",
"Jadi ini bukan drama, hanya isi hati yang selama ini ak pendam. Aku yaaa cuma ingin ngilang sebentar dan satu-satunya opsi yang selama ini ak pikirkan, soalnya kalau diterusin aku bisa rada gila gara-gara cemburu.",
"I wish you always happy. 🤍"
];
const pages=document.getElementById('pages'),dots=document.getElementById('dots');
let cur=0;
texts.forEach((t,i)=>{
  const s=document.createElement('div');
  s.className='screen pg hidden';
  const last=i===texts.length-1;
  s.innerHTML=`<div class="page"><p>${t}</p><div class="nav">${i>0?'<button class="ghost" data-act="back">Kembali</button>':''}<button data-act="next">${last?'End':'Next'}</button></div></div>`;
  pages.appendChild(s);
  dots.appendChild(document.createElement('i'));
});
const screens=[...pages.children],dotEls=[...dots.children];
function show(i){
  screens.forEach((s,k)=>{s.classList.toggle('hidden',k!==i);s.firstChild.classList.toggle('active',k===i)});
  dotEls.forEach((d,k)=>d.classList.toggle('on',k===i));
  cur=i;
}
document.getElementById('openBtn').onclick=function(){
  this.style.opacity=0;this.style.pointerEvents='none';
  document.getElementById('env').classList.add('open');
  setTimeout(()=>{
    document.getElementById('intro').classList.add('hidden');
    dots.classList.remove('hidden');
    show(0);
  },2200);
};
pages.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.act==='back'){show(cur-1);return}
  if(cur<texts.length-1)show(cur+1);
  else{
    screens[cur].classList.add('hidden');dots.classList.add('hidden');
    const end=document.createElement('div');
    end.className='screen';
    end.innerHTML='<p class="fade-text" style="font-size:1.4rem;font-style:italic">— selesai —</p>';
    document.body.appendChild(end);
  }
});
</script>
</body>
</html>
